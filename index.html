<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Super App MAN Batam Program Keagamaan</title>

  <!-- Font Modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #f4f8fd;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased selection:bg-sky-200 selection:text-blue-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // =========================================================================
    // 1. KONFIGURASI UTAMA (EDIT LINK & INFO DI BAGIAN INI SAJA)
    // =========================================================================
    const APP_CONFIG = {
      appName: 'Super App',
      institution: 'MAN Batam Program Keagamaan',
      subtitle: 'Portal Terpadu Layanan Asrama, Akademik & Pembinaan Santri',
      periodeAktif: 'Tahun Pelajaran 2026/2027',
      logoUrl: 'https://commons.wikimedia.org/wiki/Special:FilePath/Kementerian_Agama_new_logo.png',
      waAdmin: '6281234567890', // Format 628xxx (tanpa + atau 0 di depan)
      waPesan: 'Assalamu\'alaikum Admin/Pembina Asrama MAN Batam PK, saya ingin bertanya terkait layanan Super App.',
      jamLayanan: 'Senin – Ahad • Layanan Digital 24 Jam',
    };

    // TEMPEL MASING-MASING LINK FITUR PADA PROPERTI "url" DI BAWAH INI:
    const FEATURES = [
      {
        id: 'raport-aspura',
        title: 'e-Raport Aspura',
        desc: 'Cek & cetak hasil belajar asrama santri putra',
        category: 'aspura',
        badge: 'Putra',
        badgeClass: 'bg-sky-100 text-sky-700 border-sky-200',
        iconBg: 'from-sky-500 to-blue-600',
        icon: 'book',
        url: 'https://raportaspura.vercel.app/', // <-- Ganti dengan link e-Raport Aspura
      },
      {
        id: 'raport-aspuri',
        title: 'e-Raport Aspuri',
        desc: 'Cek & cetak hasil belajar asrama santri putri',
        category: 'aspuri',
        badge: 'Putri',
        badgeClass: 'bg-indigo-100 text-indigo-700 border-indigo-200',
        iconBg: 'from-blue-500 to-indigo-600',
        icon: 'book',
        url: 'https://raportaspuri-mu.vercel.app/', // <-- Ganti dengan link e-Raport Aspuri
      },
      {
        id: 'izin-aspura',
        title: 'e-Izin Aspura',
        desc: 'Pengajuan & pemantauan izin keluar santri putra',
        category: 'aspura',
        badge: 'Putra',
        badgeClass: 'bg-sky-100 text-sky-700 border-sky-200',
        iconBg: 'from-cyan-500 to-sky-600',
        icon: 'pass',
        url: 'https://izinaspura.netlify.app/', // <-- Ganti dengan link e-Izin Aspura
      },
      {
        id: 'izin-aspuri',
        title: 'e-Izin Aspuri',
        desc: 'Pengajuan & pemantauan izin keluar santri putri',
        category: 'aspuri',
        badge: 'Putri',
        badgeClass: 'bg-indigo-100 text-indigo-700 border-indigo-200',
        iconBg: 'from-sky-500 to-indigo-600',
        icon: 'pass',
        url: 'https://izinaspuri.netlify.app/', // <-- Ganti dengan link e-Izin Aspuri
      },
      {
        id: 'e-sholat',
        title: 'e-Sholat',
        desc: 'Rekap kehadiran sholat berjamaah & ibadah harian',
        category: 'pembinaan',
        badge: 'Ibadah',
        badgeClass: 'bg-teal-100 text-teal-700 border-teal-200',
        iconBg: 'from-teal-500 to-cyan-600',
        icon: 'mosque',
        url: 'https://contoh-link-esholat.com', // <-- Ganti dengan link e-Sholat
      },
      {
        id: 'e-tatib',
        title: 'e-promo',
        desc: 'Informasi poin kedisiplinan & tata tertib asrama',
        category: 'pembinaan',
        badge: 'Disiplin',
        badgeClass: 'bg-blue-100 text-blue-700 border-blue-200',
        iconBg: 'from-blue-600 to-blue-800',
        icon: 'shield',
        url: 'https://cmbgroup.netlify.app/', // <-- Ganti dengan link e-Tatib
      },
    ];

    const FILTER_TABS = [
      { key: 'all', label: 'Semua' },
      { key: 'aspura', label: 'Aspura' },
      { key: 'aspuri', label: 'Aspuri' },
      { key: 'pembinaan', label: 'Ibadah & Tatib' },
    ];

    // =========================================================================
    // 2. KOMPONEN IKON SVG (BERSIH & RINGAN)
    // =========================================================================
    function FeatureIcon({ type }) {
      if (type === 'book') {
        return (
          <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        );
      }
      if (type === 'pass') {
        return (
          <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        );
      }
      if (type === 'mosque') {
        return (
          <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 3c-2.5 2.2-4 4.3-4 6.5V12h8V9.5C16 7.3 14.5 5.2 12 3z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 21v-7a2 2 0 012-2h12a2 2 0 012 2v7M3 21h18M10 21v-4a2 2 0 014 0v4" />
          </svg>
        );
      }
      return (
        <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      );
    }

    // =========================================================================
    // 3. APLIKASI UTAMA (1 HALAMAN GAYA MOBILE BANKING)
    // =========================================================================
    function App() {
      const [activeFilter, setActiveFilter] = useState('all');
      const [activeNav, setActiveNav] = useState('beranda');
      const [logoError, setLogoError] = useState(false);
      const [noticeFeature, setNoticeFeature] = useState(null);

      const filteredFeatures = activeFilter === 'all'
        ? FEATURES
        : FEATURES.filter((item) => item.category === activeFilter);

      const waHref = `https://wa.me/${APP_CONFIG.waAdmin}?text=${encodeURIComponent(APP_CONFIG.waPesan)}`;

      const handleFeatureClick = (e, item) => {
        if (!item.url || item.url === '#' || item.url.includes('contoh-link-')) {
          e.preventDefault();
          setNoticeFeature(item);
        }
      };

      const scrollToSection = (navId, sectionId) => {
        setActiveNav(navId);
        const el = document.getElementById(sectionId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <div className="min-h-screen flex flex-col pb-24 md:pb-10">

          {/* ================= HERO HEADER BIRU ALA MOBILE BANKING ================= */}
          <header
            id="beranda"
            className="relative overflow-hidden bg-gradient-to-br from-sky-500 via-blue-600 to-blue-700 text-white rounded-b-[2rem] md:rounded-b-[2.75rem] shadow-lg shadow-blue-900/15"
          >
            {/* Ornamen Lingkaran Halus */}
            <div className="absolute -top-16 -right-16 w-56 h-56 rounded-full bg-white/10 blur-xl pointer-events-none"></div>
            <div className="absolute -bottom-20 -left-12 w-64 h-64 rounded-full bg-sky-300/15 blur-2xl pointer-events-none"></div>

            <div className="relative max-w-4xl mx-auto px-4 sm:px-6 pt-6 pb-20 md:pt-9 md:pb-24">
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-3.5">
                  <div className="w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-white/95 shadow-md flex items-center justify-center p-1.5 shrink-0">
                    {!logoError ? (
                      <img
                        src={APP_CONFIG.logoUrl}
                        alt="Logo MAN Batam"
                        onError={() => setLogoError(true)}
                        className="w-full h-full object-contain"
                      />
                    ) : (
                      <svg className="w-7 h-7 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                      </svg>
                    )}
                  </div>
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-white/15 border border-white/25 text-[11px] font-semibold tracking-wide text-sky-50 mb-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span>
                      {APP_CONFIG.appName}
                    </div>
                    <h1 className="text-lg sm:text-xl md:text-2xl font-extrabold leading-tight tracking-tight">
                      {APP_CONFIG.institution}
                    </h1>
                  </div>
                </div>

                {/* Badge Status Desktop */}
                <div className="hidden sm:flex flex-col items-end text-right">
                  <span className="text-[11px] text-sky-100 font-medium">Akses Portal</span>
                  <span className="text-xs font-bold bg-white/15 border border-white/25 px-3 py-1 rounded-xl mt-0.5">
                    Langsung Tanpa Login
                  </span>
                </div>
              </div>

              <p className="mt-3 text-xs sm:text-sm text-sky-100 max-w-2xl leading-relaxed">
                {APP_CONFIG.subtitle}
              </p>
            </div>
          </header>

          {/* ================= FLOATING SUMMARY CARD (ALA KARTU SALDO M-BANKING) ================= */}
          <main className="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 -mt-12 relative z-10 space-y-6">
            <section className="bg-white rounded-2xl md:rounded-3xl shadow-md shadow-blue-900/5 border border-blue-100/90 p-4 sm:p-5">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-blue-600">
                    Ahlan wa Sahlan • Portal Resmi
                  </p>
                  <h2 className="text-sm sm:text-base font-bold text-slate-800 mt-0.5">
                    {APP_CONFIG.periodeAktif}
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    {APP_CONFIG.jamLayanan}
                  </p>
                </div>

                <div className="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                  <div className="flex-1 sm:flex-initial bg-sky-50 border border-sky-100 rounded-xl px-3.5 py-2 text-center">
                    <div className="text-sm font-extrabold text-blue-700">{FEATURES.length} Layanan</div>
                    <div className="text-[10px] font-medium text-slate-500">Terintegrasi</div>
                  </div>
                  <button
                    type="button"
                    onClick={() => scrollToSection('bantuan', 'bantuan')}
                    className="flex-1 sm:flex-initial bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl px-4 py-2.5 text-xs font-semibold transition shadow-sm shadow-blue-600/25"
                  >
                    Pusat Bantuan
                  </button>
                </div>
              </div>
            </section>

            {/* ================= MENU LAYANAN UTAMA (6 FITUR) ================= */}
            <section id="layanan" className="space-y-4 pt-1">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h2 className="text-base md:text-lg font-extrabold text-slate-800">
                    Menu Layanan Utama
                  </h2>
                  <p className="text-xs text-slate-500">
                    Pilih layanan asrama yang ingin Anda akses
                  </p>
                </div>

                {/* Filter Tabs */}
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                  {FILTER_TABS.map((tab) => {
                    const isActive = activeFilter === tab.key;
                    return (
                      <button
                        key={tab.key}
                        type="button"
                        onClick={() => setActiveFilter(tab.key)}
                        className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all ${
                          isActive
                            ? 'bg-blue-600 text-white shadow-sm shadow-blue-600/30'
                            : 'bg-white text-slate-600 border border-slate-200 hover:border-blue-300 hover:text-blue-700'
                        }`}
                      >
                        {tab.label}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Grid 2 Kolom (HP) / 3 Kolom (Desktop) */}
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4">
                {filteredFeatures.map((item) => (
                  <a
                    key={item.id}
                    href={item.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    onClick={(e) => handleFeatureClick(e, item)}
                    className="group bg-white rounded-2xl p-4 sm:p-5 border border-blue-100/80 shadow-sm hover:shadow-lg hover:shadow-blue-500/10 hover:border-blue-300 hover:-translate-y-0.5 active:scale-[0.97] transition-all flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex items-start justify-between gap-2 mb-3.5">
                        <div className={`w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br ${item.iconBg} shadow-md shadow-blue-600/15 flex items-center justify-center group-hover:scale-105 transition-transform`}>
                          <FeatureIcon type={item.icon} />
                        </div>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${item.badgeClass}`}>
                          {item.badge}
                        </span>
                      </div>

                      <h3 className="text-sm sm:text-base font-bold text-slate-800 group-hover:text-blue-700 transition-colors leading-snug">
                        {item.title}
                      </h3>
                      <p className="text-[11px] sm:text-xs text-slate-500 mt-1 leading-relaxed">
                        {item.desc}
                      </p>
                    </div>

                    <div className="mt-4 pt-2.5 border-t border-slate-100 flex items-center justify-between text-[11px] sm:text-xs font-semibold text-blue-600">
                      <span>Buka Layanan</span>
                      <svg className="w-4 h-4 transform group-hover:translate-x-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
                      </svg>
                    </div>
                  </a>
                ))}
              </div>
            </section>

            {/* ================= KARTU INFORMASI & BANTUAN ALA M-BANKING ================= */}
            <section id="bantuan" className="bg-white rounded-2xl md:rounded-3xl border border-blue-100/80 shadow-sm p-4 sm:p-6 space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div className="flex items-start gap-3.5">
                  <div className="w-11 h-11 rounded-xl bg-sky-50 border border-sky-200 flex items-center justify-center text-blue-600 shrink-0">
                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                      <path strokeLinecap="round" strokeLinejoin="round" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                  </div>
                  <div>
                    <h3 className="text-sm sm:text-base font-bold text-slate-800">
                      Butuh Bantuan atau Kendala Akses?
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5 leading-relaxed">
                      Hubungi Admin atau Pembina Asrama Program Keagamaan jika mengalami kendala NIS/PIN raport maupun perizinan santri.
                    </p>
                  </div>
                </div>

                <a
                  href={waHref}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="shrink-0 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 active:scale-95 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm shadow-blue-600/20 transition"
                >
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12.031 2c-5.516 0-9.969 4.453-9.969 9.969 0 1.766.469 3.484 1.344 5l-1.406 5.156 5.281-1.375c1.469.797 3.109 1.219 4.75 1.219 5.516 0 9.969-4.453 9.969-9.969S17.547 2 12.031 2zm5.813 14.125c-.25.703-1.438 1.344-2 1.422-.516.078-1.172.109-1.891-.125-.438-.141-1-.328-1.719-.641-3.016-1.297-4.984-4.328-5.141-4.531-.156-.203-1.234-1.641-1.234-3.125s.781-2.219 1.063-2.516c.281-.297.609-.375.813-.375s.406 0 .578.016c.188.016.438-.078.688.531.25.609.859 2.094.938 2.25.078.156.125.344.031.547-.094.203-.141.328-.281.5-.141.172-.297.375-.422.5-.141.141-.281.297-.125.578.156.281.703 1.156 1.516 1.875 1.047.938 1.922 1.234 2.203 1.375.281.141.438.125.609-.063.172-.188.703-.828.891-1.109.188-.281.375-.234.625-.141.25.094 1.625.766 1.906.906.281.141.469.203.531.328.063.125.063.703-.188 1.406z" />
                  </svg>
                  Chat Pembina / Admin
                </a>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-2 border-t border-slate-100 text-[11px] sm:text-xs text-slate-600">
                <div className="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2">
                  <span className="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
                  <span>Pastikan memilih portal <b>Aspura (Putra)</b> atau <b>Aspuri (Putri)</b> yang sesuai.</span>
                </div>
                <div className="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2">
                  <span className="w-2 h-2 rounded-full bg-sky-500 shrink-0"></span>
                  <span>Siapkan <b>NIS &amp; PIN</b> saat membuka layanan e-Raport wali santri.</span>
                </div>
                <div className="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2">
                  <span className="w-2 h-2 rounded-full bg-teal-500 shrink-0"></span>
                  <span>Tambahkan ke <b>Layar Utama HP</b> agar akses lebih cepat seperti aplikasi.</span>
                </div>
              </div>
            </section>

            {/* ================= FOOTER ================= */}
            <footer className="text-center text-xs text-slate-400 pt-2 pb-4">
              &copy; {new Date().getFullYear()} {APP_CONFIG.appName} {APP_CONFIG.institution}. All rights reserved.
            </footer>
          </main>

          {/* ================= BOTTOM NAVIGATION BAR KHUSUS HP ================= */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-blue-100 shadow-[0_-4px_20px_rgba(15,23,42,0.06)]">
            <div className="grid grid-cols-3 h-16 max-w-md mx-auto">
              <button
                type="button"
                onClick={() => scrollToSection('beranda', 'beranda')}
                className={`flex flex-col items-center justify-center gap-1 text-[11px] font-semibold transition ${
                  activeNav === 'beranda' ? 'text-blue-600' : 'text-slate-400'
                }`}
              >
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Beranda</span>
              </button>

              <button
                type="button"
                onClick={() => scrollToSection('layanan', 'layanan')}
                className={`flex flex-col items-center justify-center gap-1 text-[11px] font-semibold transition ${
                  activeNav === 'layanan' ? 'text-blue-600' : 'text-slate-400'
                }`}
              >
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
                <span>Layanan</span>
              </button>

              <button
                type="button"
                onClick={() => scrollToSection('bantuan', 'bantuan')}
                className={`flex flex-col items-center justify-center gap-1 text-[11px] font-semibold transition ${
                  activeNav === 'bantuan' ? 'text-blue-600' : 'text-slate-400'
                }`}
              >
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span>Bantuan</span>
              </button>
            </div>
          </nav>

          {/* ================= MODAL PEMBERITAHUAN JIKA LINK BELUM DIISI ================= */}
          {noticeFeature && (
            <div
              className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4"
              onClick={() => setNoticeFeature(null)}
            >
              <div
                className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl border border-blue-100 space-y-3 text-center"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="w-12 h-12 mx-auto rounded-2xl bg-sky-50 text-blue-600 flex items-center justify-center">
                  <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <h4 className="font-bold text-slate-800 text-base">
                  Tautan {noticeFeature.title} Belum Diatur
                </h4>
                <p className="text-xs text-slate-500 leading-relaxed">
                  Layanan ini masih memakai URL contoh. Silakan isi URL aplikasi tujuan pada array <code className="bg-slate-100 px-1.5 py-0.5 rounded text-blue-700 font-semibold">FEATURES</code> di file <code className="bg-slate-100 px-1.5 py-0.5 rounded">index.html</code>.
                </p>
                <button
                  type="button"
                  onClick={() => setNoticeFeature(null)}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-xl transition"
                >
                  Mengerti
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
